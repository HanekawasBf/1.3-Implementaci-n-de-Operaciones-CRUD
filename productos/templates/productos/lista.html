<h1>Productos</h1>
<a href="{% url 'productos:crear' %}">+ Nuevo producto</a>
<ul>
  {% for p in productos %}
    <li>
      <a href="{% url 'productos:detalle' p.pk %}">{{ p.nombre }}</a>
      - ${{ p.precio }} (stock: {{ p.stock }})
      <a href="{% url 'productos:editar' p.pk %}">Editar</a>
      <a href="{% url 'productos:eliminar' p.pk %}">Eliminar</a>
    </li>
  {% empty %}
    <li>No hay productos.</li>
  {% endfor %}
</ul>
